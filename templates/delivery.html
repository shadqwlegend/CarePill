<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePill - Delivery Module</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>CarePill - Delivery</h1>
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>
    </header>
    <aside id="sidebar">
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/admin">Admin</a></li>
                <li><a href="/patient">Patient</a></li>
                <li><a href="/doctor">Doctor</a></li>
                <li><a href="/delivery">Delivery</a></li>
                <li><a href="/prescription">Prescription</a></li>
                <li><a href="/reminder">Reminder</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/register">Register</a></li>
            </ul>
        </nav>
    </aside>
    <main>
        <section id="delivery-tracking" data-module="delivery">
            <h2>Delivery Tracking</h2>
            <form id="delivery-form">
                <label for="prescription-id">Prescription ID:</label>
                <input type="number" id="prescription-id" required>
                <label for="status">Status:</label>
                <select id="status">
                    <option value="Pending">Pending</option>
                    <option value="In Transit">In Transit</option>
                    <option value="Delivered">Delivered</option>
                </select>
                <button type="submit">Add Delivery</button>
            </form>
            <div id="delivery-list">
                <h3>Deliveries</h3>
                <ul id="deliveries">
                    <!-- Deliveries will be loaded here -->
                </ul>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Telemedicine App</p>
    </footer>
    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('a[href="/delivery"]').classList.add('active');
        });
    </script>
</body>
</html>
