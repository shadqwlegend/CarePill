<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePill - Delivery Module</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Hamburger Menu Button -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">
        <img src="/static/img/hamburger.png" alt="Menu" width="40" height="40" />
    </button>
    <!-- Side Navigation Panel -->
    <div class="side-panel" id="sidePanel">
        <button class="close-panel" id="closePanelBtn" aria-label="Close menu">&times;</button>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/admin">Admin</a></li>
                <li><a href="/patient">Patient</a></li>
                <li><a href="/doctor">Doctor</a></li>
                <li><a href="/delivery">Delivery</a></li>
                <li><a href="/prescription">Prescription</a></li>
                <li><a href="/reminder">Reminder</a></li>
                <li><a href="/login">Login</a></li>
                <li><a href="/register">Register</a></li>
            </ul>
        </nav>
    </div>
    <div class="panel-backdrop" id="panelBackdrop"></div>
    <main>
        <section id="delivery-tracking" data-module="delivery">
            <h2>Delivery Tracking</h2>
            <form id="delivery-form">
                <label for="prescription-id">Prescription ID:</label>
                <input type="number" id="prescription-id" required>
                <label for="status">Status:</label>
                <select id="status">
                    <option value="Pending">Pending</option>
                    <option value="In Transit">In Transit</option>
                    <option value="Delivered">Delivered</option>
                </select>
                <button type="submit">Add Delivery</button>
            </form>
            <div id="delivery-list">
                <h3>Deliveries</h3>
                <ul id="deliveries">
                    <!-- Deliveries will be loaded here -->
                </ul>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Telemedicine App</p>
    </footer>
    <script>
    // Hamburger menu panel logic
    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const sidePanel = document.getElementById('sidePanel');
    const closePanelBtn = document.getElementById('closePanelBtn');
    const panelBackdrop = document.getElementById('panelBackdrop');
    function openPanel() {
        sidePanel.classList.add('open');
        panelBackdrop.classList.add('open');
    }
    function closePanel() {
        sidePanel.classList.remove('open');
        panelBackdrop.classList.remove('open');
    }
    hamburgerBtn.addEventListener('click', openPanel);
    closePanelBtn.addEventListener('click', closePanel);
    panelBackdrop.addEventListener('click', closePanel);
    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePanel();
    });
    </script>
</body>
</html>
