<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePill - Patient Module</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>CarePill - Patient</h1>
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        </div>
    </header>
    <nav class="main-navbar">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/admin">Admin</a></li>
            <li><a href="/patient">Patient</a></li>
            <li><a href="/doctor">Doctor</a></li>
            <li><a href="/delivery">Delivery</a></li>
            <li><a href="/prescription">Prescription</a></li>
            <li><a href="/reminder">Reminder</a></li>
            <li><a href="/login">Login</a></li>
            <li><a href="/register">Register</a></li>
        </ul>
    </nav>
    <main>
        <section id="patient-portal" data-module="patient">
            <h2>Patient Portal</h2>
            <form id="patient-registration">
                <label for="name">Name:</label>
                <input type="text" id="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" required>
                <button type="submit">Register</button>
            </form>
            <div id="appointments">
                <h3>My Appointments</h3>
                <ul id="appointment-list">
                    <!-- Appointments will be loaded here -->
                </ul>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Telemedicine App</p>
    </footer>
    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('a[href="/patient"]').classList.add('active');
        });
    </script>
</body>
</html>
